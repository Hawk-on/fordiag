[package]
name = "fordiag"
version = "0.1.0"
edition = "2024"
description = "Read-only ELM327 diagnostic CLI for the Ford S-Max Mk2"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serialport = { version = "4.10.1", default-features = false }
thiserror = "2.0.21"
